# ============================================================
# Theme override config - Hexo auto-merges this with the
# theme's own _config.yml.
# ============================================================

# === Site branding ===
brand: "English Notebook"
description: "Personal English Learning Notes"

# === Navigation menu ===
# A nested value renders as a dropdown (one level only). The practice tracks
# are grouped so the nav stays short as skills are added; /learning is the
# group's landing page and carries the numbers for every track.
menu:
  Home: null
  Archive: null
  Learning:
    Overview: /learning
    Daily Chat: /chat
    Coach: /coach
    Patterns: /patterns
    Form Drills: /form
    Rephrase: /rephrase
    Language Notes: /notes
  Tags: /

# === Social links ===
social:
  github: https://github.com/Graceth1020/English-Notebook
  twitter: ""

# === Tag tree ===
tag_tree:
  enable: true
  expand_level: 0
  mode: folder           # folder - from _posts/ folder path; frontmatter - from tag_tree field

# === Homepage post list ===
index:
  posts_per_page: 10
  show_excerpt: true
  excerpt_length: 150

# === Footer copyright ===
copyright:
  since: 2026

