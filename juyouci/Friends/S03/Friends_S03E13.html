</main><script type="application/json" id="vocab-library">{"schema_version": 1, "decks": [{"title": "Friends S03E13 · The One Where Monica and Richard Are Just Friends · IELTS 词汇", "deck_id": "friends:s03e13:zh", "language": "English", "exam_target": "IELTS", "level_target": "B2-C1", "selection_basis": "基于用户提供的 S03E13 英文原文字幕，按 IELTS 中高频、B2–C1 范围筛选短语动词、习语与实用词汇；所有例句均来自本集真实对白，不虚构台词。", "difficulty_feedback": "", "cards": [{"term": "cutoff", "meaning": "截止时间；界线（此处指停车收费的计时截止点）", "ipa": "/ˈkʌtɔːf/", "sentence": "Eight o'clock is the cutoff.", "translation": "八点就是截止时间了。", "answers": ["cutoff", "cut-off"], "targets": ["cutoff"], "target_spans": [[21, 27]], "id": "8cfe11785d51e4941679"}, {"term": "in a weird way", "meaning": "说来奇怪；从某种奇怪的角度看", "ipa": "/ɪn ə wɪrd weɪ/", "sentence": "You know, in a weird way, you have too much power.", "translation": "你知道吗，说来奇怪，你权力太大了。", "answers": ["in a weird way"], "targets": ["in a weird way"], "target_spans": [[10, 24]], "id": "1861ed4dd8bb686904e5"}, {"term": "run into", "meaning": "偶遇，碰巧遇见（某人）", "ipa": "/rʌn ˈɪntuː/", "sentence": "Or maybe it's just because God knew I'd be running into you.", "translation": "也许只是因为老天爷知道我会撞见你。", "answers": ["run into", "ran into", "running into"], "targets": ["running", "into"], "target_spans": [[43, 50], [51, 55]], "id": "c000eb257067f118de04"}, {"term": "opportunity", "meaning": "机会；时机", "ipa": "/ˌɑːpərˈtuːnəti/", "sentence": "And saw an opportunity.", "translation": "于是就逮着了这个机会。", "answers": ["opportunity"], "targets": ["opportunity"], "target_spans": [[11, 22]], "id": "86a4a76124172a3e244a"}, {"term": "grope", "meaning": "（对他人）不礼貌地摸，揩油", "ipa": "/ɡroʊp/", "sentence": "No. Just friends. I won't grope you. I promise.", "translation": "不，就当普通朋友。我保证不会对你动手动脚。", "answers": ["grope"], "targets": ["grope"], "target_spans": [[26, 31]], "id": "da58420f66c3fac8b2ac"}, {"term": "make a deal", "meaning": "达成约定；讲定一个条件", "ipa": "/meɪk ə diːl/", "sentence": "Oh, I know. I'm sorry. Listen, I'll make a deal with you, okay?", "translation": "我知道，抱歉。听着，我跟你做个约定，好吗？", "answers": ["make a deal"], "targets": ["make a deal"], "target_spans": [[36, 47]], "id": "f0340f4511af77aeba34"}, {"term": "supportive", "meaning": "支持的；鼓励的；体谅配合的", "ipa": "/səˈpɔːrtɪv/", "sentence": "Well, now, if you need to stay late, I want to be supportive of that.", "translation": "既然你需要加班，我愿意体谅支持你。", "answers": ["supportive"], "targets": ["supportive"], "target_spans": [[50, 60]], "id": "977ae3ae38db03ede485"}, {"term": "all sorts of", "meaning": "各种各样的，形形色色的", "ipa": "/ɔːl sɔːrts əv/", "sentence": "He's gonna teach me how to do all sorts of jock stuff.", "translation": "他打算教我玩各种运动型项目。", "answers": ["all sorts of"], "targets": ["all sorts of"], "target_spans": [[30, 42]], "id": "5447b785576b2c25240c"}, {"term": "innocent", "meaning": "单纯的，没有暧昧意图的；清白的", "ipa": "/ˈɪnəsnt/", "sentence": "Oh, there's no such thing as an innocent burger.", "translation": "哪有什么单纯吃个汉堡这回事啊。", "answers": ["innocent"], "targets": ["innocent"], "target_spans": [[32, 40]], "id": "1769d1cc114a27fafabb"}, {"term": "get over", "meaning": "从（失恋、难过等）中恢复过来，放下", "ipa": "/ɡet ˈoʊvər/", "sentence": "Well, she spent the last six months getting over him.", "translation": "她花了整整半年才从他这段感情里走出来。", "answers": ["get over", "getting over", "gotten over"], "targets": ["getting", "over"], "target_spans": [[36, 43], [44, 48]], "id": "8c3969610314c616da41"}, {"term": "potluck dinner", "meaning": "自带食物的聚餐（各自带菜分享的晚宴）", "ipa": "/ˈpɑːtlʌk ˈdɪnər/", "sentence": "I'm just gonna teach him how to make a lasagna for some potluck dinner he has.", "translation": "我只是要教他做份千层面，去参加他那个自带菜的聚餐。", "answers": ["potluck dinner", "potluck"], "targets": ["potluck"], "target_spans": [[56, 63]], "id": "4f96f74f4702f32f0429"}, {"term": "sit in on", "meaning": "列席，旁听（会议、课程）", "ipa": "/sɪt ɪn ɑːn/", "sentence": "I got to sit in on a meeting with the reps from Calvin Klein.", "translation": "我还列席了一场和 Calvin Klein 销售代表的会议。", "answers": ["sit in on"], "targets": ["sit in on"], "target_spans": [[9, 18]], "id": "e864795e7ae14ebe6420"}, {"term": "a ton of", "meaning": "大量，一大堆（口语，非正式）", "ipa": "/ə tʌn əv/", "sentence": "I told my boss I liked this line of lingerie, she ordered a ton of it.", "translation": "我跟老板说喜欢这系列内衣，她就订了一大堆。", "answers": ["a ton of", "tons of"], "targets": ["a ton of"], "target_spans": [[58, 66]], "id": "027cf883ada5a235183b"}, {"term": "discover", "meaning": "发现，发觉（原本不知道的事）", "ipa": "/dɪˈskʌvər/", "sentence": "I discovered I'm able to count all my teeth using just my tongue.", "translation": "我发现自己光用舌头就能数清所有牙齿。", "answers": ["discover", "discovered"], "targets": ["discovered"], "target_spans": [[2, 12]], "id": "68ec905a4b5db43ae421"}, {"term": "plenty of", "meaning": "充足的，大量的（后接可数或不可数名词）", "ipa": "/ˈplenti əv/", "sentence": "I never start reading The Shining without making sure we got plenty of room in the freezer.", "translation": "我每次开始看《闪灵》前，都得先确认冰箱里有足够空间。", "answers": ["plenty of"], "targets": ["plenty of"], "target_spans": [[61, 70]], "id": "619b931bf8fb12955211"}, {"term": "over and over again", "meaning": "反复地，一遍又一遍地", "ipa": "/ˌoʊvər ənd ˈoʊvər əˈɡen/", "sentence": "Haven't you ever read the same book over and over again?", "translation": "你难道从没把同一本书反复读过好多遍吗？", "answers": ["over and over again", "over and over"], "targets": ["over and over again"], "target_spans": [[36, 55]], "id": "8096e888cc3629f357af"}, {"term": "see about that", "meaning": "走着瞧，那就看看（结果再说）", "ipa": "/siː əˈbaʊt ðæt/", "sentence": "Uh, well, we'll just see about that, okay?", "translation": "那就走着瞧，好吗？", "answers": ["see about that"], "targets": ["see about that"], "target_spans": [[21, 35]], "id": "8ce06e275fdab9a19d49"}, {"term": "burst into flame", "meaning": "突然着火，猛地烧起来", "ipa": "/bɜːrst ˈɪntuː fleɪm/", "sentence": "Right, right. Sometimes you guys just burst into flame.", "translation": "对对，你们加州人有时候简直会当场自燃似的。", "answers": ["burst into flame", "burst into flames"], "targets": ["burst", "into", "flame"], "target_spans": [[38, 43], [44, 48], [49, 54]], "id":
